<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Seatwork 2</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    
    <style>
        body {
            background-image: url("https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/33191010-2a7d-46b9-bb10-3130d37cd664/OBMC+CASA+classroom+1.jpg?format=1000w");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .navbar-custom {
            background-color: #FFD700; 
        }
        .logo-placeholder {
            width: 40px;
            height: 40px;
            background-color: #ffffff;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #333;
            margin-right: 10px;
            border: 1px dashed #333;
        }
    </style>
</head>
<body>


    <nav class="navbar navbar-expand-lg navbar-custom px-4 py-2 shadow-sm">
        <div class="container-fluid">
        
            <a class="navbar-brand d-flex align-items-center fw-bold text-dark" href="#">
                
                <div class="logo-placeholder">OBMC</div>
                Contact Us
            </a>


            <form class="d-flex" role="search">
                <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-primary" type="submit">Search</button>
            </form>
        </div>
    </nav>


    <div class="container my-5">
        <div class="row g-4 align-items-start">
            
         
            <div class="col-md-7">
                <div class="bg-white p-3 rounded shadow-sm">
                    <h2 class="text-center mb-3 fs-4">School Office Hours</h2>
                    
                    <table class="table table-striped table-bordered text-center mb-0">
                        <thead class="table-primary">
                            <tr>
                                <th>Day</th>
                                <th>Office Hours</th>
                                <th>Department</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Monday</td>
                                <td>8:00 AM - 4:00 PM</td>
                                <td>Registrar's Office</td>
                            </tr>
                            <tr>
                                <td>Tuesday</td>
                                <td>8:00 AM - 4:00 PM</td>
                                <td>Cashier Office</td>
                            </tr>
                            <tr>
                                <td>Wednesday</td>
                                <td>8:00 AM - 4:00 PM</td>
                                <td>Guidance Office</td>
                            </tr>
                            <tr>
                                <td>Thursday</td>
                                <td>8:00 AM - 4:00 PM</td>
                                <td>Principal's Office</td>
                            </tr>
                            <tr>
                                <td>Friday</td>
                                <td>8:00 AM - 3:00 PM</td>
                                <td>Front Office</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

           
            <div class="col-md-5">
                <div class="bg-white p-4 rounded shadow-sm">
                    <h1 class="text-center mb-4 fs-3">Contact Us</h1>
                    
                    <form>
                        <div class="mb-3">
                            <label for="fullName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="emailAddress" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="emailAddress" placeholder="Enter your email" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="subject" class="form-label">Subject</label>
                            <input type="text" class="form-control" id="subject" placeholder="Enter subject" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="3" placeholder="Type your message here" required></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">Send Message</button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
